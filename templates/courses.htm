{% extends "base.htm" %}

{% block content %}

  <div class="header">
    <h2>Available Courses</h2>
    <span class="chip">Catalog • 3</span>
  </div>
  <div class="grid cols-3">
    {% for c in courses %}
      <div class="card">
        {% if c.resolved_image_url %}
          <img class="thumb" src="{{ c.resolved_image_url }}" alt="course image" style="object-fit:cover; width:100%; height:180px;">
        {% else %}
          <div class="thumb">No Image</div>
        {% endif %}
        <div class="meta">
          <div class="title">{{ c.title }}</div>
          <div class="muted" style="font-size:14px;">{{ c.description }}</div>
          <div class="muted" style="font-size:12px;">Institution: {{ c.institution }}</div>
          <div style="display:flex; gap:10px; margin-top:10px;">
            <a class="btn" href="{{ url_for('course_detail', course_id=c.id) }}">Explore Course</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
