<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Friepedia+</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root{
        --bg:#0b0f1a;
        --panel:#0f172a;
        --glass:rgba(255,255,255,0.06);
        --glass-strong:rgba(255,255,255,0.12);
        --text:#e5e7eb;
        --muted:#9ca3af;
        --accent:#60a5fa;
        --accent2:#a78bfa;
        --success:#34d399;
        --warning:#fbbf24;
        --danger:#fb7185;
        --shadow: 0 10px 30px rgba(0,0,0,0.35);
        --radius:18px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color:var(--text);
        background: radial-gradient(1200px 600px at 20% -20%, #1e3a8a33, transparent),
                    radial-gradient(1000px 700px at 120% 10%, #7c3aed33, transparent),
                    var(--bg);
        display:flex;
      }
      .app{
        display:flex; width:100%; min-height:100%;
      }
      .sidebar{
        width:280px; min-width:260px; padding:24px 20px; position:sticky; top:0; height:100vh;
        background: linear-gradient(180deg, rgba(17,24,39,0.85), rgba(2,6,23,0.85));
        backdrop-filter:saturate(130%) blur(8px);
        border-right:1px solid rgba(255,255,255,0.06);
      }
      .brand{
        display:flex; align-items:center; gap:12px; margin-bottom:22px;
      }
      .logo{
        width:42px; height:42px; border-radius:12px;
        background: linear-gradient(145deg, var(--accent), var(--accent2));
        box-shadow: var(--shadow);
      }
      .brand h1{
        font-size:20px; margin:0; letter-spacing:0.3px;
        background: linear-gradient(90deg, #fff, #c7d2fe);
        -webkit-background-clip:text; background-clip:text; color:transparent;
      }
      .nav{
        display:flex; flex-direction:column; gap:8px; margin-top:8px;
      }
      .nav a{
        text-decoration:none; color:var(--text);
        padding:12px 14px; border-radius:12px; display:flex; align-items:center; gap:10px;
        background:transparent; border:1px solid transparent;
        transition:all .2s ease;
      }
      .nav a:hover{
        background: var(--glass); border-color: var(--glass-strong); transform: translateY(-1px);
      }
      .content{
        flex:1; padding:28px; overflow:auto;
      }
      .panel{
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
        border:1px solid rgba(255,255,255,0.08);
        border-radius: var(--radius); box-shadow: var(--shadow);
      }
      .header{
        display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;
      }
      .chip{
        display:inline-flex; align-items:center; gap:8px; font-size:12px; color:#cbd5e1;
        padding:8px 12px; border-radius:999px; background:var(--glass); border:1px solid rgba(255,255,255,0.1);
      }
      .grid{
        display:grid; gap:18px;
      }
      @media(min-width:900px){ .grid.cols-3{ grid-template-columns: repeat(3, 1fr);} }
      @media(min-width:700px){ .grid.cols-2{ grid-template-columns: repeat(2, 1fr);} }
      .btn{
        appearance:none; border:none; cursor:pointer; border-radius:12px; padding:12px 16px; font-weight:600;
        color:#0b1020; background: linear-gradient(180deg,#93c5fd,#60a5fa);
        box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease;
      }
      .btn:hover{ transform: translateY(-1px); }
      .btn.secondary{ background: linear-gradient(180deg,#a78bfa,#7c3aed); color:#0b1020; }
      .btn.ghost{ background:transparent; color:var(--text); border:1px solid rgba(255,255,255,0.12); }
      .field{ display:flex; flex-direction:column; gap:8px; }
      .input, .select, .textarea{
        width:100%; padding:12px 14px; border-radius:12px; color:var(--text);
        border:1px solid rgba(255,255,255,0.12);
        background: rgba(15,23,42,0.6);
        outline:none; transition:border-color .2s ease, background .2s ease;
      }
      .input:focus, .select:focus, .textarea:focus{
        border-color: rgba(96,165,250,0.8); background: rgba(15,23,42,0.75);
      }
      .muted{ color: var(--muted); }
      .card{
        overflow:hidden; position:relative;
        display:flex; flex-direction:column; border-radius:16px;
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
        border:1px solid rgba(255,255,255,0.08); box-shadow: var(--shadow);
      }
      .card .thumb{
        height:160px; background:#0b1224; display:flex; align-items:center; justify-content:center; color:#94a3b8;
      }
      .card .meta{ padding:14px 14px 16px 14px; display:flex; flex-direction:column; gap:8px;}
      .card .title{ font-weight:700; }
      .alert{
        padding:12px 14px; border-radius:12px; margin-bottom:16px;
        border:1px solid rgba(255,255,255,0.1); background: rgba(16,185,129,0.12); color:#a7f3d0;
      }
      .footer-note{ color:#94a3b8; font-size:12px; margin-top:18px; }
      /* Tables */
      table{ width:100%; border-collapse: collapse; }
      th, td{ padding:12px 10px; border-bottom:1px solid rgba(255,255,255,0.08); }
      th{ text-align:left; color:#c7d2fe; background: rgba(99,102,241,0.08); }
      .pdf-frame{
        width:100%; height:480px; border:1px solid rgba(255,255,255,0.12); border-radius:14px; background:#0b1224;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo"></div>
          <h1>Friepedia+</h1>
        </div>
        <div class="nav">
          <a href="{{ url_for('landing') }}">Landing</a>
          <a href="{{ url_for('create') }}">Create/Submit Module</a>
          <a href="{{ url_for('courses_list') }}">Available Courses</a>
          <a href="{{ url_for('dashboard') }}">Global Funds</a>
          <a href="{{ url_for('profile') }}">Profile</a>
        </div>
        <div class="footer-note">
          Evidence-first learning. Verifiable. Incentivized.
        </div>
      </aside>
      <main class="content">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for m in messages %}
              <div class="alert">{{ m }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
